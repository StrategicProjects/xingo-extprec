# xingo-extprec (PLAN.md trilha L2, D-0081 and D-0109): publishable on its
# own, with its own version; its only runtime dependencies are `xingo-sparse`
# (optional, feature `sparse`) and `pulp` (optional, feature `simd`). As in
# `xingo-sparse`, nothing is inherited from the workspace
# (`*.workspace = true`), so that this directory also builds alone: it is
# mirrored, by `git subtree split`, to the stand-alone repository below
# (the routine of D-0097), which Zenodo archives for the DOI. The values
# must stay equal to the workspace's.
[package]
name = "xingo-extprec"
version = "0.1.2"
description = "Extended precision for numerical linear algebra: double-double arithmetic with proven error bounds, compensated kernels and rigorous interval enclosures of residuals"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StrategicProjects/xingo-extprec"
readme = "README.md"
documentation = "https://docs.rs/xingo-extprec"
keywords = ["double-double", "interval", "extended-precision", "verified", "linear-algebra"]
categories = ["mathematics", "science", "algorithms"]
# The package is the source, its tests, examples, README, CHANGELOG and
# licenses. The proptest regression seeds are development state (replayed
# by `cargo test` from a checkout, meaningless to a user of the crate); the
# workflows are the mirror's CI and Pages; site/ is the mirror's landing page.
exclude = ["tests/*.proptest-regressions", ".github/", "site/", ".zenodo.json"]

# docs.rs builds with every feature so that `verify` and `DdDense` (feature
# `sparse`) appear, and with the private items so that every chapter does:
# most chapters, the proofs of the bounds among them, are the documentation
# of private modules.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[features]
default = ["sparse", "simd"]
# `Real` for `DoubleDouble` over the containers and factorizations of
# `xingo-sparse` (question E1 of the chapter: the dependency points from
# here to `xingo-sparse`). Off: the scalar type and the slice kernels only.
sparse = ["dep:xingo-sparse"]
# SIMD kernels through `pulp` (pure Rust, MIT; safe run-time dispatch,
# Chapter 11.6). Off: the scalar reference kernels, bit for bit the same
# results (invariant K1).
simd = ["dep:pulp"]

[dependencies]
# From the registry, with no `path`: the stand-alone mirror has no
# `../sparse`. Inside the Xingó monorepo the root `Cargo.toml` patches it to
# `crates/sparse` (`[patch.crates-io]`), so the workspace builds and tests
# against the local source; the requirement must keep matching the local
# version, or the patch goes unused (cargo warns) and the registry's is used.
# Everything used here exists since the published 0.4.0, and 0.5 changes
# none of it: both lines are accepted, so that moving `xingo-sparse` from 0.4
# to 0.5 does not force a new minor version of this crate on its users.
xingo-sparse = { version = ">=0.4.0, <0.6.0", default-features = false, optional = true }
# The version the workspace already locks (through faer). `x86-v3` is the
# AVX2 + FMA token; `x86-v4` (AVX-512) is not used: the kernels have `W = 4`
# lanes on every target (Chapter 11.5). MIT; its dependencies are MIT,
# Apache-2.0 or Zlib (checked with `cargo tree` for 0.22.3).
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"], optional = true }

[dev-dependencies]
# Without the default features `fork` and `timeout` (no test uses them):
# their `rusty-fork`/`wait-timeout` do not build for `wasm32-wasip1`, one of
# the targets of the mirror's CI.
proptest = { version = "1.6", default-features = false, features = ["std", "bit-set"] }
# The exact oracle of the tests (D-0109, E8): arbitrary-precision rationals,
# MIT OR Apache-2.0 (checked for 0.6.1). `malachite` is LGPL and forbidden.
dashu-ratio = { version = "0.6.1", default-features = false, features = ["std"] }
dashu-int = { version = "0.6.1", default-features = false, features = ["std"] }
# The primary oracle of the elementary functions (Chapter 11.11, L2.4):
# arbitrary-precision floating point with exp, ln, the circular and
# hyperbolic functions and their inverses. MIT OR Apache-2.0 (checked for
# 0.6.2); it brings `static_assertions` (MIT OR Apache-2.0), nothing else.
dashu-float = { version = "0.6.2", default-features = false, features = ["std"] }

# The integration test instantiates the factorizations of `xingo-sparse` in
# `DoubleDouble`.
[[test]]
name = "sparse_dd"
required-features = ["sparse"]

# The acceptance tests of `verify` (Chapter 11.10) against exact rationals.
[[test]]
name = "verify"
required-features = ["sparse"]

# The acceptance tests of Algorithm E (Chapter 11.10, Theorem E) against
# exact rationals, with adversarial solves.
[[test]]
name = "forward_error"
required-features = ["sparse"]

# The measurements behind Rule P of `xingo-sparse` (Chapter 11.8) and the
# timing harness of the kernels (L2.2b); both print Markdown tables.
[[example]]
name = "dd_profile"
required-features = ["sparse"]

[[example]]
name = "dd_bench"
required-features = ["sparse"]

# The timing harness of the elementary functions (Chapter 11.11, "Cost"):
# a Markdown table; no feature needed.
[[example]]
name = "elementary_bench"

# The experiment behind the default of `LuOptions::update_multiplier_limit`
# (L1.8, D-0113): Forrest–Tomlin exchanges with tiny pivots, f64 and dd.
[[example]]
name = "ft_limit"
required-features = ["sparse"]

# The workspace's lints, spelled out (see the header comment).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mathematical notation is kept (PLAN.md §2.3): allowed per module when declared.
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
