# Lint configuration of `xingo-extprec` (Chapter 11.11, L2.4; D-0121).
#
# The elementary functions of `DoubleDouble` must give the same bits on
# every platform (invariant D5). The documentation of `f64` declares the
# precision of its transcendental functions "non-deterministic", so none of
# them may appear in this crate: the seeds of the algorithms are tables,
# and only `+ − × ÷ √ fma round trunc` of `f64` are used. Tests and
# examples, which may use them for arguments but never as a reference
# value, opt out with `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "f64::exp", reason = "non-deterministic precision; Chapter 11.11 forbids libm in this crate" },
    { path = "f64::exp2", reason = "non-deterministic precision; Chapter 11.11 forbids libm in this crate" },
    { path = "f64::exp_m1", reason = "non-deterministic precision; Chapter 11.11 forbids libm in this crate" },
    { path = "f64::ln", reason = "non-deterministic precision; Chapter 11.11 forbids libm in this crate" },
    { path = "f64::ln_1p", reason = "non-deterministic precision; Chapter 11.11 forbids libm in this crate" },
