# CI of the stand-alone mirror of `xingo-extprec` (the crate is developed in
# the Xingó monorepo, https://github.com/StrategicProjects/xingo, whose CI
# runs the same checks inside the workspace; this file is excluded from the
# published package). In the mirror `xingo-sparse` comes from crates.io.
# `ubuntu-latest` is x86_64: the first run of the AVX2 kernels and of the
# golden bits of the elementary functions off aarch64.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only token; third-party actions are pinned to a commit (the tag is
# in the comment).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PROPTEST_DISABLE_FAILURE_PERSISTENCE: 1

jobs:
  check:
    name: fmt + clippy + test + docs (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.90"] # stable and MSRV
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default, no default features, each feature alone)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features --features sparse -- -D warnings
          cargo clippy --all-targets --no-default-features --features simd -- -D warnings
      - name: Test (default, no default features, each feature alone)
        run: |
          cargo test
          cargo test --no-default-features
          cargo test --no-default-features --features sparse
          cargo test --no-default-features --features simd
      - name: Test (release)
        run: cargo test --release
      # Lemma D of Chapter 11.11 is a computer-assisted proof: the whole
      # certificate (every exponent, about 20 s in release) is re-run here;
      # the default run of the suite checks a sample of exponents only.
      - name: Certificate of Lemma D (all exponents)
        run: cargo test --release --test reduction_bound -- --ignored
      # The public API, and the whole book as docs.rs and Pages build it
      # (`--document-private-items`), with and without the default features.
      - name: Docs (default, no default features, all features; private items)
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --no-default-features
          cargo doc --no-deps --all-features
          cargo doc --no-deps --all-features --document-private-items
          cargo doc --no-deps --no-default-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The examples print the Markdown tables of the measurements (all but
      # `elementary_bench` need the feature `sparse`); release, because
      # `ft_limit` takes about 90 s there. The second column of `dd_bench`'s
      # output is the SIMD backend of this runner (`avx2` or `scalar`), and
      # `elementary_bench` names it in its header. Run only: no timing is
      # asserted.
      - name: Examples
        run: |
          cargo build --examples
          cargo build --examples --no-default-features --features sparse
          cargo run --release --example dd_bench k8
          cargo run --release --example dd_profile
          cargo run --release --example ft_limit
          cargo run --release --example elementary_bench
          cargo run --release --no-default-features --example elementary_bench
      - name: Package (dry run)
        run: cargo publish --dry-run

  # The same bits on every target is a property of the design (invariant D5
  # of Chapter 11.11, K1 of Chapter 11.5): the golden bits of the elementary
  # functions and the SIMD kernels against the scalar reference are checked
  # here on the targets the job above does not cover.
  targets:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "aarch64 macOS, NEON", os: macos-latest, target: "" }
          - { name: "x86_64 Windows", os: windows-latest, target: "" }
          - { name: "aarch64 Linux, NEON", os: ubuntu-24.04-arm, target: "" }
          - { name: "i686 Linux, 32 bits", os: ubuntu-latest, target: i686-unknown-linux-gnu }
          # Big-endian (the golden bits are compared as `u64`, so a byte-order
          # slip would show), run under QEMU user mode; no SIMD backend, so
          # `backend()` is `"scalar"` with the default features.
          - { name: "s390x Linux, big-endian, QEMU", os: ubuntu-latest, target: s390x-unknown-linux-gnu }
          # WebAssembly with WASI, run by wasmtime; no SIMD backend either
          # (no `simd128` path), and the test harness runs on one thread.
          - { name: "wasm32 WASI, wasmtime", os: ubuntu-latest, target: wasm32-wasip1 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: 32-bit C toolchain
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # The cross linker and libc of s390x, and `qemu-s390x` as cargo's
      # runner (`-L`: where the s390x dynamic loader and libc live); the
      # doc-tests run through the same runner.
      - name: s390x C toolchain and QEMU
        if: matrix.target == 's390x-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          echo "CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER=s390x-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER=qemu-s390x -L /usr/s390x-linux-gnu" >> "$GITHUB_ENV"
      # wasmtime from its release, pinned by version and by the SHA-256 that
      # GitHub records for the asset (no third-party action), as cargo's
      # runner for `wasm32-wasip1`.
      - name: wasmtime
        if: matrix.target == 'wasm32-wasip1'
        run: |
          V=v50.0.2
          cd "$RUNNER_TEMP"
          curl -sSfL -o wasmtime.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/$V/wasmtime-$V-x86_64-linux.tar.xz"
          echo "5db0ca8e838ab95a51ba9acdf11f42888bcd0092dda45a86129ae540c4fa952c  wasmtime.tar.xz" | sha256sum -c -
          tar xJf wasmtime.tar.xz
          echo "$RUNNER_TEMP/wasmtime-$V-x86_64-linux" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime" >> "$GITHUB_ENV"
      - name: Test (debug and release; default and no default features)
        shell: bash
        run: |
          T="${{ matrix.target }}"
          if [ -n "$T" ]; then T="--target $T"; fi
          cargo test $T
          cargo test $T --release
          cargo test $T --no-default-features
